[package]
name = "hydra-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Standalone: mobile dependencies stay out of hc's Cargo.lock and license notices.
[workspace]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
base64 = "0.22"
# Already in the tree through russh; named here for the OS random source used by key generation.
getrandom = { version = "0.4", features = ["sys_rng"] }
herdr-classic = { path = "../herdr-classic" }
herdr-classic-control = { path = "../herdr-classic-control" }
russh = { version = "=0.62.0", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tokio-util = "0.7"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "debuginfo"
