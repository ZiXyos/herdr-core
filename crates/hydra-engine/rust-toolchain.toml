# Pinned for reproducible mobile engine builds (edition 2024 needs >= 1.85). Targets are declared
# here so rustup installs them for this exact toolchain; build scripts never mutate toolchains.
[toolchain]
channel = "1.99.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
targets = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
]
